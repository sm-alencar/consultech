services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: consultech
      MYSQL_USER: consultech
      MYSQL_PASSWORD: consultech
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: consultech
      DB_PASSWORD: consultech
      DB_NAME: consultech
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: